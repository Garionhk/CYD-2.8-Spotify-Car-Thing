; CYD Spotify Remote — ESP32-2432S028R ("Cheap Yellow Display")
;
; Display follows the MP3 player project: TFT_eSPI is built for ST7789 (same User_Setup as
; ../ESP32 2.8 LCD MP3 Player), and the firmware can switch to ILI9341 at runtime by sending that
; controller's init table itself. Panel, inversion and rotation are settings in NVS, so one
; binary serves both glass variants. Touch is bit-banged (src/touch), not on an SPI host.

[platformio]
default_envs = cyd
; LittleFS image (pio run -e cyd -t uploadfs): the title fonts from tools/gen_font.py
data_dir = fs

; cyd     the app (src/ minus src/hwtest/)
; hwtest  the Stage 0 hardware test screen (src/ minus src/main.cpp)

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Root CAs for TLS (tools/gen_ca_bundle.py); only the matching root is parsed per handshake.
board_build.embed_files = data/x509_crt_bundle.bin
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200          ; CH340: 921600 fails; MP3 project found 115200 reliable

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    bodmer/TJpg_Decoder@1.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI configured here instead of User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; TFT_BL deliberately not defined: the firmware drives the backlight with PWM itself.
    -DST7789_DRIVER=1
    ; Inversion is applied at runtime from settings (default off, see config.h).
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:cyd]
build_src_filter = +<*> -<hwtest/>

; The app with the acceptance-test endpoints (/spotify/test-skips, /spotify/test-expiry).
[env:cyd_test]
build_src_filter = +<*> -<hwtest/>
build_flags =
    ${env.build_flags}
    -DCYD_TEST_HOOKS=1

[env:hwtest]
build_src_filter = +<*> -<main.cpp>
